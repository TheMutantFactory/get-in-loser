	<script>
		// Non-interactive, non-deterministic: on each page load, tilt the
		// background gradient by a random angle of less than 10deg off vertical.
		(function () {
			var tilt = Math.random() * 20 - 10; // (-10, 10) degrees
			document.documentElement.style.setProperty('--yc-bg-angle', (180 + tilt).toFixed(2) + 'deg');
		})();
	</script>
	<script src="dist/bundle.js"></script>
</head>
<body>
	<div class="wrapper">

		<nav aria-label="Main Menu" class="main_menu" id="main_menu"></nav>
		
		<div class="submenu">
			<a class="logo" href="#" aria-label="Get in loser">Get&nbsp;in&nbsp;<span class="logo_l" aria-hidden="true"></span>oser</a>
			<button class="smart_folder_toggle" id="smart_folder_toggle" type="button" aria-pressed="false" title="Smart folder: off — click to pick a folder">
				<span class="sr_only">Toggle smart folder</span>
				<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
					<path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/>
				</svg>
			</button>
			<div class="block attributes" id="action_attributes"></div>
			<button class="undo_button" id="undo_button" type="button">
				<span class="sr_only">Undo</span>
			</button>
		</div>
		
		<div class="sidebar_left" id="tools_container"></div>


		<div class="middle_area" id="middle_area">

			<canvas class="ruler_left" id="ruler_left"></canvas>
			<canvas class="ruler_top" id="ruler_top"></canvas>

			<div class="main_wrapper" id="main_wrapper">
				<div class="canvas_wrapper" id="canvas_wrapper">
					<div id="mouse"></div>
					<div class="transparent-grid" id="canvas_minipaint_background"></div>
					<canvas id="canvas_minipaint">
						<div class="trn error">
							Your browser does not support canvas or JavaScript is not enabled.
						</div>
					</canvas>
				</div>
			</div>
		</div>

		<div class="sidebar_right">
			<div class="preview block">
				<h2 class="trn toggle" data-target="toggle_preview">Preview</h2>
				<div id="toggle_preview"></div>
			</div>
			
			<div class="colors block">
				<h2 class="trn toggle" data-target="toggle_colors">Colors</h2>
				<div class="content" id="toggle_colors"></div>
			</div>
			
			<div class="block" id="info_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_info">Information</h2>
				<div class="content" id="toggle_info"></div>
			</div>
			
			<div class="details block" id="details_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_details">Layer details</h2>
				<div class="content details-content" id="toggle_details"></div>
			</div>
			
			<div class="layers block">
				<h2 class="trn">Layers</h2>
				<div class="content" id="layers_base"></div>
			</div>
		</div>
	</div>
	<div class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
	</div>
	<div class="hidden" id="tmp"></div>
	<div id="popups"></div>
	<script>
		// Logo whimsy: each letter gets its own LFO to bob up/down, the hand
		// hovers like a ghost, and the "ticker" advancing the letter LFOs is
		// mouse movement (so the wave animates as you move, and rests when still).
		// Progressive enhancement over the static logo.
		(function () {
			var logo = document.querySelector('.logo');
			if (!logo || !window.requestAnimationFrame) return;

			function letters(str, grad) {
				var frag = document.createDocumentFragment();
				for (var i = 0; i < str.length; i++) {
					var s = document.createElement('span');
					s.className = 'logo_ch' + (grad ? ' logo_grad' : '');
					s.textContent = str[i] === ' ' ? ' ' : str[i];
					frag.appendChild(s);
				}
				return frag;
			}
			var hand = document.createElement('span');
			hand.className = 'logo_l';
			hand.setAttribute('aria-hidden', 'true');

			logo.textContent = '';
			logo.appendChild(letters('Get in ', false));
			logo.appendChild(hand);
			logo.appendChild(letters('oser', true));

			var chars = [].slice.call(logo.getElementsByClassName('logo_ch'));

			// Ticker = mouse movement: accumulate distance moved into a target phase.
			var target = 0, phase = 0, lastX = null, lastY = null;
			addEventListener('mousemove', function (e) {
				if (lastX !== null) {
					var dx = e.clientX - lastX, dy = e.clientY - lastY;
					target += Math.min(50, Math.sqrt(dx * dx + dy * dy)) * 0.010;
				}
				lastX = e.clientX; lastY = e.clientY;
			});

			var start = null;
			function tick(now) {
				if (start === null) start = now;
				var t = (now - start) / 1000;
				phase += (target - phase) * 0.08; // ease applied phase toward mouse-driven target

				for (var i = 0; i < chars.length; i++) {
					// per-letter LFO: own frequency + phase offset -> subtle travelling wave
					var y = Math.sin(phase * (0.6 + i * 0.05) + i * 0.8) * 1.7;
					chars[i].style.transform = 'translateY(' + y.toFixed(2) + 'px)';
				}
				// hand: continuous ghostly hover (on its own) + a little mouse-driven drift
				var hy = Math.sin(t * 1.15) * 2.3 + Math.sin(phase * 0.8) * 1.1;
				var hx = Math.cos(t * 0.8) * 1.3;
				hand.style.transform = 'translate(' + hx.toFixed(2) + 'px,' + hy.toFixed(2) + 'px)';

				requestAnimationFrame(tick);
			}
			requestAnimationFrame(tick);
		})();
	</script>
</body>
</html>
