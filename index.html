<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="x-ua-compatible" content="IE=edge" />
	<title>Get in loser</title>
	<meta name="description" content="Get in loser is a personal browser-based image editor built with HTML5. Edit and adjust your images right in your browser, no install required." />
	<meta name="keywords" content="photo, image, picture, transparent, layers, free, edit, html5, canvas, javascript, image editor, effects, sharpen, blur, eraser, clone, rotate, resize" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0" />
	<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
	<link rel="icon" sizes="192x192" href="images/favicon.png">
	<!-- <link rel="manifest" href="dist/manifest.json"> -->
	<!-- Google -->
	<meta itemprop="name" content="Get in loser" />
	<meta itemprop="description" content="A personal browser-based image editor built with HTML5." />
	<!-- TODO(hosting): absolute-URL social tags disabled until the public host is known. See TODO.md. -->
	<!-- <meta itemprop="image" content="https://YOUR-HOST/get-in-loser/images/preview.jpg" /> -->
	<!-- Twitter -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Get in loser" />
	<meta name="twitter:description" content="A personal browser-based image editor built with HTML5." />
	<!-- <meta name="twitter:image" content="https://YOUR-HOST/get-in-loser/images/preview.jpg" /> -->
	<meta name="twitter:image:alt" content="Get in loser image editor" />
	<!-- Facebook, Pinterest -->
	<meta property="og:title" content="Get in loser" />
	<meta property="og:type" content="article" />
	<!-- <meta property="og:url" content="https://YOUR-HOST/get-in-loser/" /> -->
	<!-- <meta property="og:image" content="https://YOUR-HOST/get-in-loser/images/preview.jpg" /> -->
	<meta property="og:description" content="A personal browser-based image editor built with HTML5." />
	<meta property="og:site_name" content="Get in loser" />
	
	<script>
		// Non-interactive, non-deterministic: on each page load, tilt the
		// background gradient by a random angle of less than 10deg off vertical.
		(function () {
			var tilt = Math.random() * 20 - 10; // (-10, 10) degrees
			document.documentElement.style.setProperty('--yc-bg-angle', (180 + tilt).toFixed(2) + 'deg');
		})();
	</script>
	<script src="dist/bundle.js"></script>
</head>
<body>
	<div class="wrapper">

		<nav aria-label="Main Menu" class="main_menu" id="main_menu"></nav>
		
		<div class="submenu">
			<a class="logo" href="#" aria-label="Get in loser">Get in <span class="logo_l" aria-hidden="true"></span>oser</a>
			<div class="block attributes" id="action_attributes"></div>
			<button class="undo_button" id="undo_button" type="button">
				<span class="sr_only">Undo</span>
			</button>
		</div>
		
		<div class="sidebar_left" id="tools_container"></div>


		<div class="middle_area" id="middle_area">

			<canvas class="ruler_left" id="ruler_left"></canvas>
			<canvas class="ruler_top" id="ruler_top"></canvas>

			<div class="main_wrapper" id="main_wrapper">
				<div class="canvas_wrapper" id="canvas_wrapper">
					<div id="mouse"></div>
					<div class="transparent-grid" id="canvas_minipaint_background"></div>
					<canvas id="canvas_minipaint">
						<div class="trn error">
							Your browser does not support canvas or JavaScript is not enabled.
						</div>
					</canvas>
				</div>
			</div>
		</div>

		<div class="sidebar_right">
			<div class="preview block">
				<h2 class="trn toggle" data-target="toggle_preview">Preview</h2>
				<div id="toggle_preview"></div>
			</div>
			
			<div class="colors block">
				<h2 class="trn toggle" data-target="toggle_colors">Colors</h2>
				<div class="content" id="toggle_colors"></div>
			</div>
			
			<div class="block" id="info_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_info">Information</h2>
				<div class="content" id="toggle_info"></div>
			</div>
			
			<div class="details block" id="details_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_details">Layer details</h2>
				<div class="content details-content" id="toggle_details"></div>
			</div>
			
			<div class="layers block">
				<h2 class="trn">Layers</h2>
				<div class="content" id="layers_base"></div>
			</div>
		</div>
	</div>
	<div class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button">
			<span class="sr_only">Toggle Menu</span>
		</button>
	</div>
	<div class="hidden" id="tmp"></div>
	<div id="popups"></div>
</body>
</html>
